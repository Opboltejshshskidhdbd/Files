name: Extract Roblox Luau UI ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set variables
        run: |
          echo "ZIP_NAME=roblox-luau-assistant-ui-master-1.zip" >> $GITHUB_ENV
          echo "REMOTE_RAW=https://github.com/Opboltejshshskidhdbd/Files/raw/main/${ZIP_NAME}" >> $GITHUB_ENV

      - name: Ensure unzip installed
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Locate or download ZIP
        run: |
          if [ -f "$ZIP_NAME" ]; then
            echo "Found $ZIP_NAME in repo"
          else
            echo "$ZIP_NAME not found in repo, attempting to download from Files repo"
            curl -L -f -o "$ZIP_NAME" "$REMOTE_RAW"
          fi
          ls -lh "$ZIP_NAME"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "$ZIP_NAME" -d extracted/
          echo "Top-level extracted files:"
          ls -la extracted | sed -n '1,200p'

      - name: Create branch and commit extracted files
        env:
          BRANCH: extract-roblox-ui
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add extracted
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract $ZIP_NAME (via workflow)"
            git push --set-upstream origin "$BRANCH"
            echo "Pushed changes to branch $BRANCH"
          fi
