name: Extract Roblox Luau UI ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set variables
        run: |
          echo "ZIP_NAME=roblox-luau-assistant-ui-master-1.zip" >> $GITHUB_ENV
          # build a raw.githubusercontent.com URL (works for files in repo)
          echo "REMOTE_RAW=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/$ZIP_NAME" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" >> $GITHUB_ENV

      - name: Ensure unzip installed
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Show working dir and repo files (debug)
        run: |
          set -euxo pipefail
          echo "PWD: $(pwd)"
          echo "List repo root:"
          ls -la

      - name: Locate or download ZIP
        run: |
          set -euxo pipefail
          echo "Looking for $ZIP_NAME in repo root..."
          if [ -f "$ZIP_NAME" ]; then
            echo "Found $ZIP_NAME in repo"
          else
            echo "$ZIP_NAME not found in repo, attempting to download from $REMOTE_RAW"
            curl -L --fail -o "$ZIP_NAME" "$REMOTE_RAW"
          fi
          echo "After locate/download, ls -lh of ZIP:"
          ls -lh "$ZIP_NAME" || true

      - name: Extract ZIP
        run: |
          set -euxo pipefail
          mkdir -p extracted
          echo "Unzipping $ZIP_NAME -> extracted/"
          unzip -o "$ZIP_NAME" -d extracted/
          echo "Recursive listing of extracted content:"
          ls -la extracted
          echo "Full tree (first 500 lines):"
          find extracted -maxdepth 5 -type d -print -exec ls -la {} \; | sed -n '1,500p'

      - name: Create branch and commit extracted files
        env:
          BRANCH: extract-roblox-ui
        run: |
          set -euxo pipefail
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # create new branch from current HEAD
          git checkout -b "$BRANCH"
          # stage everything under extracted (handles nested paths)
          git add extracted || true
          echo "Staged files (git status --porcelain):"
          git status --porcelain
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract $ZIP_NAME (via workflow)"
            # push (actions/checkout with persist-credentials should permit this using GITHUB_TOKEN)
            git push --set-upstream origin "$BRANCH"
            echo "Pushed changes to branch $BRANCH"
          fi